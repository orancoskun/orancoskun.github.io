<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="auraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d14" />
      <stop offset="100%" stop-color="#141924" />
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#auraBg)" />

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
  </g>

  <!-- Container -->
  <rect x="50" y="45" width="1100" height="585" rx="14" fill="#0d111a" stroke="#1f2637" stroke-width="1.5" />

  <!-- Header -->
  <rect x="50" y="45" width="1100" height="52" rx="14" fill="#141926" />
  <rect x="50" y="85" width="1100" height="12" fill="#141926" />
  <line x1="50" y1="97" x2="1150" y2="97" stroke="#1f2637" stroke-width="1" />

  <circle cx="80" cy="71" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="100" cy="71" r="6" fill="#f59e0b" opacity="0.8" />
  <circle cx="120" cy="71" r="6" fill="#10b981" opacity="0.8" />

  <text x="150" y="76" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">aura-synthesizer // vector-space / pgvector / cosine-similarity: 0.941</text>
  <rect x="960" y="58" width="160" height="26" rx="4" fill="#312e81" stroke="#4f46e5" stroke-width="1" />
  <text x="1040" y="75" text-anchor="middle" fill="#c7d2fe" font-family="monospace" font-size="11">LOCAL EMBEDDINGS</text>

  <!-- Left: Knowledge Graph Nodes -->
  <rect x="75" y="120" width="560" height="485" rx="10" fill="#101522" stroke="#1b2336" stroke-width="1" />
  <text x="100" y="150" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600">SEMANTIC CITATION GRAPH</text>

  <!-- Graph Connections -->
  <g stroke="#4f46e5" stroke-width="1.5" stroke-opacity="0.4">
    <line x1="220" y1="280" x2="350" y2="230" />
    <line x1="350" y1="230" x2="480" y2="300" />
    <line x1="350" y1="230" x2="320" y2="390" />
    <line x1="220" y1="280" x2="190" y2="420" />
    <line x1="190" y1="420" x2="320" y2="390" />
    <line x1="320" y1="390" x2="480" y2="430" />
    <line x1="480" y1="300" x2="480" y2="430" />
  </g>

  <!-- Nodes with Glow -->
  <!-- Center Node -->
  <circle cx="350" cy="230" r="42" fill="url(#nodeGlow)" />
  <circle cx="350" cy="230" r="22" fill="#4f46e5" stroke="#818cf8" stroke-width="2" />
  <text x="350" y="235" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">ROOT</text>
  <text x="350" y="268" text-anchor="middle" fill="#c7d2fe" font-family="monospace" font-size="11">Raft Consensus</text>

  <!-- Node 2 -->
  <circle cx="220" cy="280" r="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" />
  <text x="220" y="315" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">Log Replication</text>

  <!-- Node 3 -->
  <circle cx="480" cy="300" r="20" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2" />
  <text x="480" y="335" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">Leader Election</text>

  <!-- Node 4 -->
  <circle cx="190" cy="420" r="16" fill="#1e1b4b" stroke="#a855f7" stroke-width="2" />
  <text x="190" y="450" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">State Machine</text>

  <!-- Node 5 -->
  <circle cx="320" cy="390" r="24" fill="#065f46" stroke="#34d399" stroke-width="2" />
  <text x="320" y="394" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">TARGET</text>
  <text x="320" y="430" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="10">Safety Invariant (k=1)</text>

  <!-- Node 6 -->
  <circle cx="480" cy="430" r="18" fill="#1e1b4b" stroke="#ec4899" stroke-width="2" />
  <text x="480" y="465" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">Snapshotting</text>

  <rect x="95" y="525" width="520" height="60" rx="6" fill="#0b0e16" stroke="#1d2435" />
  <text x="110" y="548" fill="#38bdf8" font-family="monospace" font-size="11">> query: "How does membership reconfiguration handle split brains?"</text>
  <text x="110" y="568" fill="#34d399" font-family="monospace" font-size="11">> returned: 4 verified primary citations in 18ms (Hybrid BM25 + HNSW)</text>

  <!-- Right: Synthesized Knowledge Output -->
  <rect x="655" y="120" width="470" height="485" rx="10" fill="#101522" stroke="#1b2336" stroke-width="1" />
  <text x="680" y="150" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600">VERIFIED ANSWER SYNTHESIS</text>

  <rect x="680" y="175" width="420" height="150" rx="8" fill="#141a2a" stroke="#252f46" stroke-width="1" />
  <text x="700" y="202" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Joint Consensus Transition Protocol</text>
  <text x="700" y="226" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">In Raft, cluster membership change transitions through a</text>
  <text x="700" y="246" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">transitional state called joint consensus <tspan fill="#818cf8" font-weight="bold">[Doc §4.3]</tspan>, requiring</text>
  <text x="700" y="266" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">independent majorities from both old and new configurations.</text>
  <rect x="700" y="286" width="130" height="24" rx="4" fill="#312e81" />
  <text x="765" y="302" text-anchor="middle" fill="#c7d2fe" font-family="monospace" font-size="10">99.2% Confidence</text>

  <text x="680" y="355" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">VECTOR EMBEDDING SPECIFICATIONS</text>
  
  <rect x="680" y="375" width="200" height="85" rx="6" fill="#161c2c" stroke="#28334b" />
  <text x="695" y="400" fill="#64748b" font-family="sans-serif" font-size="10">EMBEDDING MODEL</text>
  <text x="695" y="426" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold">bge-large-en-v1.5</text>
  <text x="695" y="446" fill="#38bdf8" font-family="monospace" font-size="10">1024 dimensions</text>

  <rect x="900" y="375" width="200" height="85" rx="6" fill="#161c2c" stroke="#28334b" />
  <text x="915" y="400" fill="#64748b" font-family="sans-serif" font-size="10">INDEX ALGORITHM</text>
  <text x="915" y="426" fill="#34d399" font-family="monospace" font-size="14" font-weight="bold">HNSW (M=16, ef=64)</text>
  <text x="915" y="446" fill="#94a3b8" font-family="monospace" font-size="10">Recall @ 10: 98.7%</text>

  <rect x="680" y="480" width="420" height="105" rx="6" fill="#0b0e16" stroke="#1d2435" />
  <text x="695" y="505" fill="#a78bfa" font-family="monospace" font-size="11">✓ Zero cloud data leakage (100% on-premise execution)</text>
  <text x="695" y="530" fill="#38bdf8" font-family="monospace" font-size="11">✓ Streaming token output: 95 tok/s via llama.cpp</text>
  <text x="695" y="555" fill="#34d399" font-family="monospace" font-size="11">✓ PostgreSQL 16 + pgvector native extension</text>
</svg>
