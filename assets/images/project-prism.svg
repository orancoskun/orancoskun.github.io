<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="prismBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1115" />
      <stop offset="100%" stop-color="#181a20" />
    </linearGradient>
    <linearGradient id="prismAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#prismBg)" />

  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
  </g>

  <!-- Container -->
  <rect x="50" y="45" width="1100" height="585" rx="14" fill="#13151b" stroke="#252834" stroke-width="1.5" />
  
  <!-- Header -->
  <rect x="50" y="45" width="1100" height="52" rx="14" fill="#191c24" />
  <rect x="50" y="85" width="1100" height="12" fill="#191c24" />
  <line x1="50" y1="97" x2="1150" y2="97" stroke="#252834" stroke-width="1" />

  <circle cx="80" cy="71" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="100" cy="71" r="6" fill="#f59e0b" opacity="0.8" />
  <circle cx="120" cy="71" r="6" fill="#10b981" opacity="0.8" />

  <text x="150" y="76" fill="#f3f4f6" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">prism-ui / design-tokens / components / primitives.tsx</text>
  <rect x="940" y="58" width="180" height="26" rx="13" fill="#202430" stroke="#374151" stroke-width="1" />
  <text x="1030" y="75" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="11">npm i @prism/core</text>

  <!-- Left Sidebar (Token Matrix) -->
  <rect x="50" y="97" width="260" height="533" fill="#0f1117" />
  <line x1="310" y1="97" x2="310" y2="630" stroke="#252834" stroke-width="1" />

  <text x="80" y="135" fill="#6b7280" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">COLOR TOKEN PALETTE</text>

  <g transform="translate(80, 155)">
    <rect x="0" y="0" width="36" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="42" y="0" width="36" height="24" rx="4" fill="#3b82f6" />
    <rect x="84" y="0" width="36" height="24" rx="4" fill="#10b981" />
    <rect x="126" y="0" width="36" height="24" rx="4" fill="#f59e0b" />
    <rect x="168" y="0" width="36" height="24" rx="4" fill="#ec4899" />
  </g>

  <text x="80" y="225" fill="#6b7280" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">TYPOGRAPHY RAMPS</text>
  <text x="80" y="260" fill="#f9fafb" font-family="sans-serif" font-size="22" font-weight="700">Display 48px</text>
  <text x="80" y="290" fill="#e5e7eb" font-family="sans-serif" font-size="16" font-weight="600">Heading 24px</text>
  <text x="80" y="315" fill="#9ca3af" font-family="sans-serif" font-size="13">Body Regular 14px / 1.6</text>
  <text x="80" y="338" fill="#6b7280" font-family="monospace" font-size="11">Code Mono 12px</text>

  <text x="80" y="385" fill="#6b7280" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1">ACCESSIBILITY (WCAG AAA)</text>
  <rect x="80" y="405" width="200" height="34" rx="6" fill="#14532d" fill-opacity="0.2" stroke="#22c55e" stroke-width="1" />
  <text x="95" y="426" fill="#4ade80" font-family="monospace" font-size="11">Contrast Ratio: 14.8:1</text>

  <rect x="80" y="450" width="200" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="95" y="471" fill="#93c5fd" font-family="monospace" font-size="11">ARIA 1.2 Compliant</text>

  <!-- Interactive Component Playground -->
  <text x="340" y="135" fill="#9ca3af" font-family="monospace" font-size="12" font-weight="600">INTERACTIVE COMPONENT SPECIMEN</text>

  <!-- Button Row -->
  <rect x="340" y="160" width="130" height="42" rx="8" fill="url(#prismAccent)" />
  <text x="405" y="186" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Primary Button</text>

  <rect x="485" y="160" width="130" height="42" rx="8" fill="#1f2430" stroke="#3b82f6" stroke-width="1.5" />
  <text x="550" y="186" text-anchor="middle" fill="#60a5fa" font-family="sans-serif" font-size="13" font-weight="600">Secondary</text>

  <rect x="630" y="160" width="110" height="42" rx="8" fill="transparent" stroke="#374151" stroke-width="1" />
  <text x="685" y="186" text-anchor="middle" fill="#9ca3af" font-family="sans-serif" font-size="13" font-weight="500">Ghost</text>

  <!-- Card preview -->
  <rect x="340" y="230" width="400" height="190" rx="10" fill="#171a22" stroke="#2c3244" stroke-width="1" />
  <rect x="365" y="255" width="44" height="44" rx="10" fill="#3b82f6" fill-opacity="0.15" />
  <circle cx="387" cy="277" r="10" fill="#3b82f6" />
  <text x="425" y="272" fill="#f3f4f6" font-family="sans-serif" font-size="15" font-weight="600">Card.Interactive</text>
  <text x="425" y="292" fill="#9ca3af" font-family="sans-serif" font-size="12">Headless accessible compound primitive</text>
  <line x1="365" y1="320" x2="715" y2="320" stroke="#252a38" stroke-width="1" />
  <rect x="365" y="345" width="160" height="10" rx="5" fill="#374151" />
  <rect x="365" y="365" width="240" height="10" rx="5" fill="#242a38" />
  <rect x="365" y="385" width="90" height="18" rx="4" fill="#10b981" fill-opacity="0.2" />
  <text x="410" y="398" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="10">8.2k downloads</text>

  <!-- Right Code Output & Benchmarks -->
  <rect x="765" y="160" width="360" height="445" rx="10" fill="#0c0e14" stroke="#202432" stroke-width="1" />
  <rect x="765" y="160" width="360" height="34" rx="10" fill="#141822" />
  <rect x="765" y="184" width="360" height="10" fill="#141822" />
  <text x="785" y="182" fill="#94a3b8" font-family="monospace" font-size="11">JSX &amp; CSS Bundle Size</text>
  
  <g font-family="monospace" font-size="12" xml:space="preserve">
    <text x="785" y="220" fill="#e2e8f0"><tspan fill="#ec4899">import</tspan> { Button, Card } <tspan fill="#ec4899">from</tspan> <tspan fill="#f59e0b">'@prism/ui'</tspan>;</text>
    <text x="785" y="250" fill="#64748b">// Zero runtime CSS injection</text>
    <text x="785" y="275" fill="#64748b">// Pure modern CSS custom props</text>
    <text x="785" y="310" fill="#38bdf8">&lt;<tspan fill="#60a5fa">Card</tspan> variant=<tspan fill="#f59e0b">"elevated"</tspan>&gt;</text>
    <text x="785" y="335" fill="#38bdf8">  &lt;<tspan fill="#60a5fa">Button</tspan> intent=<tspan fill="#f59e0b">"primary"</tspan>&gt;</text>
    <text x="785" y="360" fill="#f8fafc">    Launch Pipeline</text>
    <text x="785" y="385" fill="#38bdf8">  &lt;/<tspan fill="#60a5fa">Button</tspan>&gt;</text>
    <text x="785" y="410" fill="#38bdf8">&lt;/<tspan fill="#60a5fa">Card</tspan>&gt;</text>
  </g>

  <!-- Bundle specs -->
  <line x1="785" y1="440" x2="1105" y2="440" stroke="#1f2432" stroke-width="1" />
  <text x="785" y="470" fill="#94a3b8" font-family="sans-serif" font-size="11">TOTAL GZIPPED FOOTPRINT</text>
  <text x="785" y="505" fill="#34d399" font-family="monospace" font-size="26" font-weight="bold">1.4 KB <tspan font-size="12" fill="#94a3b8">tree-shaken</tspan></text>

  <rect x="785" y="530" width="320" height="55" rx="6" fill="#131722" stroke="#232a3c" stroke-width="1" />
  <text x="800" y="552" fill="#38bdf8" font-family="monospace" font-size="11">✓ Lighthouse Score: 100/100</text>
  <text x="800" y="572" fill="#a78bfa" font-family="monospace" font-size="11">✓ Framework agnostic (React/Vue/Svelte)</text>
</svg>
